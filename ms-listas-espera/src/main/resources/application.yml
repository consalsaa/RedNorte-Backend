server:
  port: 8081

spring:
  application:
    name: ms-listas-espera
  
  # Configuración de base de datos (H2 por defecto, PostgreSQL en Kubernetes)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:listas_espera_db}
    driverClassName: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  
  # Configuración de JPA/Hibernate
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update} # Útil en desarrollo para auto-crear tablas
    show-sql: true # Imprime las sentencias SQL en consola
  
  # Habilitar consola web de H2
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # Caching Config
  cache:
    type: redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
