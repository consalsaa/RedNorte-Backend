#set( $symbol_dollar = '$' )
server:
  port: 8080

spring:
  application:
    name: ${artifactId}
  
  # Base de datos H2 en memoria por defecto para Desarrollo Local
  datasource:
    url: jdbc:h2:mem:${artifactId}_db;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  
  # Consola web de H2
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

# Registro de Cliente en Eureka Server
eureka:
  client:
    service-url:
      defaultZone: ${symbol_dollar}{EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Configuracion base preestablecida para Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      listasEsperaService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
