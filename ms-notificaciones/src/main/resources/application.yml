server:
  port: 8085

spring:
  application:
    name: ms-notificaciones
  
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
  
  # Base de datos H2 en memoria por defecto para Desarrollo Local
  datasource:
    url: jdbc:h2:mem:ms-notificaciones_db;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  
  # Consola web de H2
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

# Registro de Cliente en Eureka Server
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Configuracion base preestablecida para Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      listasEsperaService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
